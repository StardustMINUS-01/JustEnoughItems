# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
# This setting speeds up running single tasks from subprojects by only configuring what's needed.
# see https://docs.gradle.org/current/userguide/multi_project_configuration_and_execution.html
# Disabled because this breaks ForgeGradle tasks
org.gradle.configureondemand=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# JEI
modName=JEIunofficial
modId=jei
modAuthor=StardustMINUS and the Stellar Remnants Team
# http://maven.apache.org/guides/mini/guide-naming-conventions.html
modGroup=mezz.jei
modDescription=An unofficial fork of JustEnoughItems (JEI) for Stellar Remnants. Enhances JEI with several features. Do not install alongside the official JEI. Copyright (c) 2014-2015 mezz (MIT), adapted GTNH NotEnoughItems portions (c) 2019-2024 mitchej123 and the GTNH Team (LGPL-3.0-or-later), original additions (c) 2026 StardustMINUS and the Stellar Remnants Team.
# Mojang ships Java 21 to end users in 1.20.5+
modJavaVersion=21
githubUrl=https://github.com/StardustMINUS-01/JustEnoughItems

# Minecraft
minecraftVersion=1.21.1
minecraftVersionRange=[1.21, 1.21.1)
# https://projects.neoforged.net/neoforged/neoform
neoformTimestamp=20240808.144430
# Earliest version of minecraft that is still compatible
minecraftVersionRangeStart=1.21

# Forge
# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.21.1.html
forgeVersion=52.1.1
forgeLoaderVersionRange=[51,)
# minimum version for
# "Add a way to render tooltips from Formatted text and TooltipComponents elements (#10056)"
# https://github.com/MinecraftForge/MinecraftForge/pull/10056#event-13755707083
forgeVersionRange=[51.0.31,)

# NeoForge
# https://projects.neoforged.net/neoforged/neoforge
neoforgeVersion=21.1.238
neoforgeLoaderVersionRange=[4,)
# first 21.1 version with net.neoforged.neoforge.common.extensions.TooltipFlagExtension#shouldDisplayAllInformation
neoforgeVersionRange=[21.1.238,)
neogradle.subsystems.conventions.runs.create-default-run-per-type=false

# Fabric
# https://fabricmc.net/develop/
fabricLoaderVersion=0.19.3
fabricApiVersion=0.116.13+1.21.1
fabricLoaderVersionRange=>=0.16.3
# This version added net.fabricmc.fabric.api.item.v1.FabricItemStack#getCreatorNamespace:
# https://github.com/FabricMC/fabric-api/pull/4746
fabricApiVersionRange=>=0.116.5+1.21.1

# AMECS (Fabric only, for keybinds with modifiers)
# https://maven.siphalor.de/de/siphalor/amecsapi-1.20/maven-metadata.xml
amecsMinecraftVersion=1.20
amecsVersionFabric=1.5.6+mc1.20.2

# Mappings
# https://parchmentmc.org/docs/getting-started
parchmentMinecraftVersion=1.21.1
parchmentVersionForge=2024.11.17-1.21.1
parchmentVersionFabric=2024.11.17

